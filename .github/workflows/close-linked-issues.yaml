name: Close linked issues on PR merge
on:
  pull_request:
    types: [closed]
    branches:
      - develop

permissions:
  issues: write
  pull-requests: read

jobs:
  close-linked-issues:
    if: ${{ github.event.pull_request.merged == true }}
    runs-on: ubuntu-latest
    steps:
      - name: Close issues referenced in PR body
        env:
          GH_TOKEN: ${{ github.token }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          echo "$PR_BODY" \
            | grep -oiE '(close[sd]?|fix(e[sd])?|resolve[sd]?|refs?|references?)[[:space:]]+#[0-9]+' \
            | grep -oE '[0-9]+' \
            | sort -u \
            | while read -r num; do
                echo "Closing issue #$num"
                gh issue close "$num" --repo "$REPO" \
                  --comment "Closed automatically by merged PR #$PR_NUMBER"
              done
